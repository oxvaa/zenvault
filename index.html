<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zenvault 4.6.1 → Snack</title>
  <style>
    body{
      font-family:system-ui,-apple-system,sans-serif;
      background:#f4f6f8;
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px
    }
    main{
      width:min(620px,100%);
      background:white;
      border-radius:28px;
      padding:28px;
      box-shadow:0 20px 60px #0001
    }
    h1{font-size:30px;margin:8px 0}
    p{color:#666;line-height:1.5}
    button{
      width:100%;
      padding:17px;
      border:0;
      border-radius:17px;
      background:#111;
      color:#fff;
      font-weight:800;
      font-size:16px
    }
    pre{
      white-space:pre-wrap;
      background:#f3f4f6;
      padding:15px;
      border-radius:15px
    }
    a{
      display:none;
      margin-top:15px;
      text-align:center;
      padding:15px;
      border:1px solid #ddd;
      border-radius:15px;
      color:#111;
      text-decoration:none;
      font-weight:700
    }
  </style>
</head>

<body>
<main>
  <small>ZENVault® BANK & CO.</small>
  <h1>Zenvault 4.6.1</h1>
  <p>Vytvoří kompletní multi-file projekt v Expo Snacku včetně card a brand assets.</p>

  <button id="go">Vytvořit nový Snack 4.6.1</button>
  <pre id="status">Připraveno.</pre>
  <a id="open" target="_blank">Otevřít Snack</a>
</main>

<script type="module">
const status = document.querySelector('#status');
const button = document.querySelector('#go');
const open = document.querySelector('#open');

async function sdk() {
  try {
    return await import('https://cdn.jsdelivr.net/npm/snack-sdk@6.6.2/+esm');
  } catch(e) {
    return await import('https://esm.sh/snack-sdk@6.6.2?bundle');
  }
}

button.onclick = async () => {
  button.disabled = true;

  try {
    status.textContent = '1/4 Načítám Zenvault 4.6.1…';

    const response = await fetch(
      'https://raw.githubusercontent.com/oxvaa/zenvault/main/snack-payload-4.6.1.json'
    );

    if (!response.ok) throw new Error('Payload HTTP ' + response.status);

    const payload = await response.json();

    status.textContent = '2/4 Načítám Expo Snack SDK…';

    const { Snack } = await sdk();

    status.textContent = '3/4 Připravuji soubory a assets…';

    const snack = new Snack({
      name: payload.manifest.name,
      description: payload.manifest.description,
      sdkVersion: payload.manifest.sdkVersion,
      files: payload.code,
      dependencies: payload.dependencies,
      online: false
    });

    status.textContent = '4/4 Ukládám projekt na Expo…';

    const result = await snack.saveAsync({
      ignoreUser: true,
      isDraft: false
    });

    const state = await snack.getStateAsync();
    const id = result.id || result.snackId || result.accountSnackId;

    status.textContent =
      'HOTOVO ✅\n' +
      'Files: ' + Object.keys(state.files || {}).length +
      '\nDependencies: ' + Object.keys(state.dependencies || {}).length +
      '\nSnack ID: ' + id;

    if (id) {
      open.href = 'https://snack.expo.dev/' + id;
      open.style.display = 'block';
    }

  } catch (e) {
    status.textContent = 'ERROR ❌\n' + (e.message || e);
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
